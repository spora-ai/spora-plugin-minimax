name: CI

# External actions are pinned to full commit SHAs to prevent supply-chain
# attacks via tag reassignment. Run `gh api repos/OWNER/REPO/git/refs/tags/vN`
# to look up the current SHA when upgrading. Review SonarCloud hotspots
# (rule githubactions:S7637) periodically.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Primary test + coverage gate on PHP 8.4 (the production target).
    # Single Pest invocation: parallel runner + pcov + clover output.
    # SonarQube depends on this job for the coverage report.
    name: Pest + coverage (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # The plugin requires spora-core >=0.15.0 for MediaAssetReader
      # (added in spora-core#195, not yet released on Packagist). The
      # path repo declared in this repo's composer.json points at the
      # sibling spora-core checkout below, so the lock file can resolve
      # against the dev ref. `ref: main` is acceptable for a forward-
      # only feature addition; pin to a SHA when this becomes a long-
      # lived dependency.
      - name: Checkout spora-core (sibling)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: spora-ai/spora-core
          ref: main
          path: spora-core

      # pcov is ~3-5x faster than xdebug for coverage. The trade-off is
      # that branch/path coverage is not reported (statement + line only),
      # which is fine for the quality gate (clover XML is consumed by
      # SonarCloud which only needs line coverage).
      - name: Setup PHP with pcov
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: pcov
          tools: composer

      - name: Rewrite composer.json path repo for CI
        # The committed composer.json uses '../spora-core' (local-dev path).
        # CI's plugin checkout sits at GITHUB_WORKSPACE with spora-core as a
        # sibling, so the path repo must be 'spora-core' here. Rewrite in
        # place — the running compose step below calls `composer update` so
        # the lock file regenerates against the new URL.
        run: |
          sed -i.bak 's|"url": "../spora-core"|"url": "spora-core"|' composer.json
          rm composer.json.bak

      - name: Composer install
        # `composer update spora-ai/spora-core` is needed because the
        # path repo URL is re-registered at runtime (CI layout differs
        # from local), and the lock file still references the original URL.
        run: composer update spora-ai/spora-core --no-interaction --with-all-dependencies

      - name: Run Pest (parallel, with coverage)
        run: composer test:coverage:clover

      - name: Upload coverage.xml
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-found: error
          retention-days: 7

  test-85:
    # PHP 8.5 compatibility check: same suite, no coverage. Runs in
    # parallel with the 8.4 test+coverage job. If the suite passes on
    # 8.4 but fails on 8.5, the PR is blocked.
    name: Pest (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout spora-core (sibling)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: spora-ai/spora-core
          ref: main
          path: spora-core

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: curl, mbstring
          coverage: none
          tools: composer

      - name: Rewrite composer.json path repo for CI
        # The committed composer.json uses '../spora-core' (local-dev path).
        # CI's plugin checkout sits at GITHUB_WORKSPACE with spora-core as a
        # sibling, so the path repo must be 'spora-core' here. Rewrite in
        # place — the running compose step below calls `composer update` so
        # the lock file regenerates against the new URL.
        run: |
          sed -i.bak 's|"url": "../spora-core"|"url": "spora-core"|' composer.json
          rm composer.json.bak

      - name: Composer install
        # `composer update spora-ai/spora-core` is needed because the
        # path repo URL is re-registered at runtime (CI layout differs
        # from local), and the lock file still references the original URL.
        run: composer update spora-ai/spora-core --no-interaction --with-all-dependencies

      - name: Run Pest (parallel)
        run: composer test:parallel

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout spora-core (sibling)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: spora-ai/spora-core
          ref: main
          path: spora-core

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none
          tools: composer

      - name: Rewrite composer.json path repo for CI
        # The committed composer.json uses '../spora-core' (local-dev path).
        # CI's plugin checkout sits at GITHUB_WORKSPACE with spora-core as a
        # sibling, so the path repo must be 'spora-core' here. Rewrite in
        # place — the running compose step below calls `composer update` so
        # the lock file regenerates against the new URL.
        run: |
          sed -i.bak 's|"url": "../spora-core"|"url": "spora-core"|' composer.json
          rm composer.json.bak

      - name: Composer install
        # `composer update spora-ai/spora-core` is needed because the
        # path repo URL is re-registered at runtime (CI layout differs
        # from local), and the lock file still references the original URL.
        run: composer update spora-ai/spora-core --no-interaction --with-all-dependencies

      - name: Run PHPStan
        run: composer analyse

  code-style:
    name: php-cs-fixer (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout spora-core (sibling)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: spora-ai/spora-core
          ref: main
          path: spora-core

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none
          tools: composer

      - name: Rewrite composer.json path repo for CI
        # The committed composer.json uses '../spora-core' (local-dev path).
        # CI's plugin checkout sits at GITHUB_WORKSPACE with spora-core as a
        # sibling, so the path repo must be 'spora-core' here. Rewrite in
        # place — the running compose step below calls `composer update` so
        # the lock file regenerates against the new URL.
        run: |
          sed -i.bak 's|"url": "../spora-core"|"url": "spora-core"|' composer.json
          rm composer.json.bak

      - name: Composer install
        # `composer update spora-ai/spora-core` is needed because the
        # path repo URL is re-registered at runtime (CI layout differs
        # from local), and the lock file still references the original URL.
        run: composer update spora-ai/spora-core --no-interaction --with-all-dependencies

      - name: Check code style
        # Dry-run (--dry-run) reports violations without rewriting files.
        # Same ruleset as Spora core's `.php-cs-fixer.php` so plugin style matches host.
        run: composer lint

  sonar:
    name: SonarCloud scan
    needs: test
    # `always()` so the scanner still runs on tag pushes of unbuildable
    # commits (e.g. the v0.1.0 placeholder), giving SonarCloud a
    # "previous version" baseline for the next push to main.
    # Skip fork PRs — secrets aren't available there and the job would
    # fail noisily.
    if: |
      always() && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download coverage.xml
        # The artifact is missing when the test job fails. The scanner
        # still runs but without coverage data.
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: coverage-report
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
